[package]
name = "libp2p_secure_gossip_lab"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "tokio", "noise", "yamux", "mdns", "gossipsub", "macros"]}
tokio = { version = "1", features = ["full"]}
futures = "0.3"
serde = { version = "1", features = ["derive"]}
serde_json = "1"
ed25519-dalek = {version = "2", features = ["rand_core"]}
rand = "0.8"
base64 = "0.22"